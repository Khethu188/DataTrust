
[flake8]
max-line-length = 150
ignore =
    E226,
    E231,
    E251,
    E261,
    E265,
    E266,
    E301,
    E302,
    E303,
    E402,
    E501,
    E711,
    E712,
    E722,
    F401,
    F541,
    F811,
    F841,
    W291,
    W292,
    W293,
    W391,
    W503,
    W504
exclude =
    .git,
    __pycache__,
    venv,
    .venv,
    data,
    logs,
    *.egg-info

