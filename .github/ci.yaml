
# ═══════════════════════════════════════════════════════════════
# DataTrust — CI/CD Pipeline
# ═══════════════════════════════════════════════════════════════
# Runs on every push and pull request:
#   1. Lint code (flake8)
#   2. Run unit tests (pytest)
#   3. Build Docker image
#   4. Security scan (bandit)
# ═══════════════════════════════════════════════════════════════

name: DataTrust CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ── Job 1: Lint ──────────────────────────────────────────
  lint:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 flake8-docstrings

      - name: Run flake8
        run: |
          flake8 src/ tests/ datatrust.py \
            --max-line-length=120 \
            --ignore=E501,W503,D100,D101,D102,D103,D104,D105,D107 \
            --statistics \
            --count

  # ── Job 2: Test ──────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: datatrust_test
          POSTGRES_USER: datatrust_admin
          POSTGRES_PASSWORD: datatrust_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests with coverage
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: datatrust_test
          DB_USER: datatrust_admin
          DB_PASSWORD: datatrust_pass
          PYTHONPATH: src/validation:src/data_generation:src/utils:src
        run: |
          pytest tests/ -v \
            --tb=short \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --junitxml=test-results.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            test-results.xml
            coverage.xml

  # ── Job 3: Security Scan ─────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install bandit
        run: pip install bandit

      - name: Run security scan
        run: |
          bandit -r src/ datatrust.py \
            -f json \
            -o bandit-report.json \
            --severity-level medium \
            -ll || true

      - name: Upload security report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-report
          path: bandit-report.json

  # ── Job 4: Docker Build ─────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test, security]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: datatrust:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image
        run: |
          docker build -t datatrust:test .
          docker run --rm datatrust:test python -c "
          import pandas, numpy, scipy, sklearn, yaml
          print('All dependencies loaded successfully!')
          print(f'pandas={pandas.__version__}')
          print(f'numpy={numpy.__version__}')
          print(f'scikit-learn={sklearn.__version__}')
          "

  # ── Job 5: Pipeline Smoke Test ──────────────────────────
  smoke-test:
    name: Pipeline Smoke Test
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate synthetic data
        env:
          PYTHONPATH: src/validation:src/data_generation:src/utils:src
        run: |
          python src/data_generation/generate_data.py

      - name: Run validation
        env:
          PYTHONPATH: src/validation:src/data_generation:src/utils:src
        run: |
          python datatrust.py validate

      - name: Run anomaly detection
        env:
          PYTHONPATH: src/validation:src/data_generation:src/utils:src
        run: |
          python datatrust.py anomalies

      - name: Verify outputs
        run: |
          echo "=== Checking generated files ==="
          ls -la data/clean/
          ls -la data/corrupted/
          ls -la data/reports/
          echo "=== Smoke test PASSED ==="

