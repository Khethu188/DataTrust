name: DataTrust CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install flake8
       - run: flake8 src/ tests/ datatrust.py --max-line-length=150 --ignore=E501,W503,E302,E303,W291,W292,W293,E231,E251,E261,E262,E265,E266,E301,E303,F401,F841,E711,E712,E722 --statistics

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: datatrust_test
          POSTGRES_USER: datatrust_admin
          POSTGRES_PASSWORD: datatrust_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r requirements.txt pytest pytest-cov
      - run: pytest tests/ -v --cov=src --cov-report=term-missing
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: datatrust_test
          DB_USER: datatrust_admin
          DB_PASSWORD: datatrust_pass
          PYTHONPATH: src/validation:src/data_generation:src/utils:src

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install bandit
      - run: bandit -r src/ datatrust.py --severity-level medium -ll || true

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test, security]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: datatrust:latest

  smoke-test:
    name: Pipeline Smoke Test
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r requirements.txt
      - run: python src/data_generation/generate_data.py
        env:
          PYTHONPATH: src/validation:src/data_generation:src/utils:src
      - run: python datatrust.py validate
        env:
          PYTHONPATH: src/validation:src/data_generation:src/utils:src
